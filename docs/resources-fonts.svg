<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-label="Outlines, metrics and atlas PNG bytes all go into one global cache at load time. Only the decode and upload of the atlas into an array texture belongs to the renderer. Both kinds of text reach a font by naming the same family.">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b93a7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="500" rx="8" fill="#fbfcfe" stroke="#dde3ee"/>

  <text x="28" y="36" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.6" fill="#5b6478">WHERE A FONT COMES FROM</text>

  <!-- the ways in -->
  <rect x="28" y="54" width="368" height="44" rx="6" fill="#ffffff" stroke="#c3cadb"/>
  <text x="44" y="81" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1b1e26">loadFontFamily('inter', { vector })</text>

  <rect x="28" y="106" width="368" height="44" rx="6" fill="#ffffff" stroke="#c3cadb"/>
  <text x="44" y="133" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1b1e26">registerFontFamily('dropped-file', …)</text>

  <rect x="464" y="54" width="368" height="44" rx="6" fill="#ffffff" stroke="#c3cadb"/>
  <text x="480" y="81" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1b1e26">createSceneRenderer({ fonts })</text>

  <rect x="464" y="106" width="368" height="44" rx="6" fill="#ffffff" stroke="#c3cadb"/>
  <text x="480" y="133" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1b1e26">handle.setMSDFFonts(sources, family)</text>

  <line x1="212" y1="150" x2="212" y2="192" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="648" y1="150" x2="648" y2="192" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- one cache, all three kinds of font data -->
  <rect x="28" y="198" width="804" height="86" rx="6" fill="#f2f8ef" stroke="#3d8a26" stroke-width="1.5"/>
  <text x="44" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.1" fill="#3d8a26">GLOBAL CACHE · device-free · survives a renderer being rebuilt</text>

  <rect x="44" y="234" width="240" height="34" rx="4" fill="#ffffff" stroke="#b9d7ab"/>
  <text x="58" y="256" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1b1e26">outlines · PolygonFontBook</text>

  <rect x="300" y="234" width="200" height="34" rx="4" fill="#ffffff" stroke="#b9d7ab"/>
  <text x="314" y="256" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1b1e26">metrics JSON</text>

  <rect x="516" y="234" width="240" height="34" rx="4" fill="#ffffff" stroke="#b9d7ab"/>
  <text x="530" y="256" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#1b1e26">atlas PNG bytes</text>

  <!-- the only per-renderer step -->
  <line x1="648" y1="284" x2="648" y2="316" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="664" y="304" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#007a80">decode · upload</text>

  <rect x="464" y="322" width="368" height="66" rx="6" fill="#eef6f6" stroke="#007a80" stroke-width="1.5"/>
  <text x="480" y="346" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.1" fill="#007a80">PER RENDERER · one device</text>
  <text x="480" y="370" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1b1e26">MSDFFontBook · array texture</text>

  <!-- outlines need no device, so they reach the node straight from the cache -->
  <line x1="212" y1="284" x2="212" y2="404" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="648" y1="388" x2="648" y2="404" stroke="#8b93a7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="28" y="410" width="368" height="44" rx="6" fill="#ffffff" stroke="#c3cadb"/>
  <text x="44" y="437" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1b1e26">VectorText · fontFamily 'inter'</text>

  <rect x="464" y="410" width="368" height="44" rx="6" fill="#ffffff" stroke="#c3cadb"/>
  <text x="480" y="437" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#1b1e26">MSDFText · fontFamily 'inter'</text>

  <text x="430" y="437" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#5b6478">one name</text>

  <text x="28" y="482" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#5b6478">Every arrow above runs at load time, before a frame loop exists. Drawing binds what is already there.</text>
</svg>
