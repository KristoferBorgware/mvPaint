name: CI

# Everything the release workflow checks before it publishes, run on the pull request instead,
# so a red release is something you already knew about rather than something you find out on
# the way to the registry.
#
# A push to master also deploys the example app to GitHub Pages from the same job. That used to
# be its own workflow, which meant a second checkout, a second `npm ci` and a second
# `build:packages` for work this job had already done. Having it here also means a deploy can
# only come off a commit that typechecks, tests and packs.
# Requires Settings -> Pages -> Source: "GitHub Actions".

on:
  pull_request:
  push:
    branches: [master]
  # Redeploy the current master to Pages without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Per job, not per workflow: a superseded check should be cancelled, an in-flight Pages
    # deployment should not be. A workflow-wide group could not say both.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The SAME npm the release workflow runs, and that is the whole point rather than a
      # detail. `npm ci` refuses a lockfile whose tree it would not have produced, and npm 10
      # and 11 do not agree on this one: 11 dedupes several nested copies (yaml@2.9.0 among
      # them) that 10 insists on. Release regenerates the lockfile during versioning, so if this
      # job read it with the npm bundled with Node 22 - which is 10 - every release would fail
      # its own checks. Pinned to the major, not `latest`, so a future npm cannot reintroduce
      # the skew by shipping while nobody is looking.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Not just `npm run build:packages`: this proves the tarballs npm would actually upload
      # are complete. The entry points, the type declarations and the engine's src/ all have to
      # be in them, and `files` in package.json is easy to get subtly wrong.
      #
      # Packed through the same strip the release runs, so what is inspected below is the shape
      # that would reach the registry rather than the working-tree shape. Restored afterwards
      # because later steps - the example app build - resolve through the development condition.
      - name: Build and pack
        run: |
          npm run build:packages
          # npm pack writes into --pack-destination but will not create it.
          mkdir -p /tmp/packed
          node scripts/strip-dev-condition.mjs strip
          npm pack -w @mvpaint/engine -w @mvpaint/ttf --pack-destination /tmp/packed
          node scripts/strip-dev-condition.mjs restore
          for t in /tmp/packed/*.tgz; do
            echo "--- $t"
            tar -tzf "$t" | sed 's|^package/||' | sort
          done

      # "development" points every entry at src/, which is how this workspace resolves itself
      # with no build step in between. Publishing strips it, so a consumer resolves to dist/ in
      # every condition - dev and production from the same artifact. Asserted on the packed
      # manifest because the failure is invisible here (this repo wants the condition) and shows
      # up only in someone else's dev server. The same strip drops prepublishOnly, which runs a
      # path that does not exist outside this repo.
      - name: Check the packed manifests carry no development condition
        run: |
          cd /tmp/packed
          for t in *.tgz; do
            tar -xzf "$t" package/package.json -O > manifest.json
            node -e '
              const pkg = JSON.parse(require("fs").readFileSync("manifest.json", "utf8"))
              const problems = []
              if (JSON.stringify(pkg.exports ?? null).includes("\"development\"")) {
                problems.push("exports still carry the development condition")
              }
              if (pkg.scripts?.prepublishOnly !== undefined) {
                problems.push("scripts.prepublishOnly survived the strip")
              }
              if (problems.length) {
                console.error(`${pkg.name}: ${problems.join("; ")}`)
                process.exit(1)
              }
              console.log(`${pkg.name}: manifest clean`)
            '
          done

      # Both packages ship code and nothing else. Fonts of every kind - MSDF atlases, glyph
      # outlines, the TTFs @mvpaint/ttf parses - are an application's assets, so a font file in
      # either tarball means something has been imported back into a package's module graph.
      #
      # Tests are excluded through a negated `files` pattern, and src/ IS shipped, so the two are
      # checked together: a pattern that stops excluding tests is otherwise invisible until
      # someone unpacks the tarball.
      - name: Check the packed packages ship code, no assets and no tests
        run: |
          cd /tmp/packed
          for t in *.tgz; do
            rm -rf package && tar -xzf "$t"
            name=$(node -p "require('./package/package.json').name")
            assets=$(find package \( -name '*.png' -o -name '*.ttf' -o -name '*.otf' \) | wc -l)
            tests=$(find package \( -name '*.test.*' -o -name '*.spec.*' \) | wc -l)
            sources=$(find package/src -name '*.ts' | wc -l)
            echo "$name: font files $assets | test files $tests | src files $sources"
            test "$assets" -eq 0
            test "$tests" -eq 0
            test "$sources" -gt 0
          done

      # src/ is shipped for the declaration maps: every .d.ts.map names a path under it, and an
      # editor follows that path for Go to Definition. A map naming a file `files` does not
      # carry resolves to nothing, which no build or typecheck reports.
      - name: Check every declaration map resolves to shipped source
        run: |
          cd /tmp/packed
          for t in *.tgz; do
          rm -rf package && tar -xzf "$t"
          node -e '
            const fs = require("fs"), path = require("path")
            const walk = (d, out = []) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, e.name)
                e.isDirectory() ? walk(p, out) : out.push(p)
              }
              return out
            }
            const maps = walk("package/dist").filter((f) => f.endsWith(".d.ts.map"))
            const dangling = []
            for (const m of maps) {
              for (const s of JSON.parse(fs.readFileSync(m, "utf8")).sources ?? []) {
                const target = path.resolve(path.dirname(m), s)
                if (!fs.existsSync(target)) dangling.push(`${m} -> ${s}`)
              }
            }
            const name = JSON.parse(fs.readFileSync("package/package.json", "utf8")).name
            console.log(`${name}: declaration maps ${maps.length}, dangling sources ${dangling.length}`)
            if (!maps.length) { console.error("no declaration maps found"); process.exit(1) }
            if (dangling.length) { console.error(dangling.slice(0, 10).join("\n")); process.exit(1) }
          '
          done

      # Vite injects its module-preload helper around dynamic imports as `const __vitePreload`,
      # a fixed name, and inlines it into the emitting chunk. build.lib suppresses that - both
      # packages set it - and this holds the line: a consumer bundling a dist that carries the
      # helper declares a second one in the same scope, and on Vite 8 that is a hard parse error
      # in their build rather than in this one.
      - name: Check the packed packages carry no Vite internals
        run: |
          cd /tmp/packed
          for t in *.tgz; do
            rm -rf package && tar -xzf "$t"
            name=$(node -p "require('./package/package.json').name")
            if grep -rlE '__vite[A-Za-z_]*' package/dist --include='*.js'; then
              echo "$name: Vite internals reached the tarball - is build.lib still set?"
              exit 1
            fi
            echo "$name: no Vite internals in dist"
          done

      # Not `npm run build`: build:packages ran above, and this resolves the workspace deps to
      # that fresh dist. Unconditional, so a pull request finds out that the app no longer
      # bundles rather than master finding out at deploy time.
      - name: Build the example app
        run: npm run build -w @mvpaint/example-app

      # Anything on master that is not a pull request build, so the manual trigger deploys too.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/example-app/dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # There is no actions/configure-pages step feeding this. Its only job would be to hand the
    # build a base path, and the example app does not want one: vite.config.ts builds with a
    # relative base so the same output works from any subpath. Pages itself is enabled in the
    # repo settings, not from here.
    permissions:
      pages: write # create the deployment
      id-token: write # deploy-pages authenticates with OIDC
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
